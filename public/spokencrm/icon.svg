<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="mic" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#6D28D9"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="256" height="256" rx="56" fill="url(#bg)"/>
  <circle cx="222" cy="34" r="60" fill="#FFFFFF" opacity="0.08"/>
  <circle cx="30" cy="230" r="48" fill="#FFFFFF" opacity="0.07"/>

  <!-- speech bubble -->
  <path d="M 52 62
           q 0 -18 18 -18
           h 116
           q 18 0 18 18
           v 84
           q 0 18 -18 18
           h -74
           l -30 28
           q -6 6 -6 -4
           v -24
           h -6
           q -18 0 -18 -18
           z"
        fill="#FFFFFF"/>

  <!-- microphone -->
  <rect x="113" y="66" width="30" height="52" rx="15" fill="url(#mic)"/>
  <path d="M 100 102 v 8 a 28 28 0 0 0 56 0 v -8"
        fill="none" stroke="url(#mic)" stroke-width="9" stroke-linecap="round"/>
  <line x1="128" y1="140" x2="128" y2="150" stroke="url(#mic)" stroke-width="9" stroke-linecap="round"/>

  <!-- sound waves -->
  <path d="M 165 78 q 10 14 0 28" fill="none" stroke="#A5B4FC" stroke-width="7" stroke-linecap="round"/>
  <path d="M 91 78 q -10 14 0 28" fill="none" stroke="#A5B4FC" stroke-width="7" stroke-linecap="round"/>
</svg>
