<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NeverMiss Privacy Policy</title>
  <meta name="description" content="NeverMiss privacy policy." />
  <style>
    :root {
      --bg: #faf8f4;
      --text: #1a1b20;
      --muted: #5c5d63;
      --accent: #d1402e;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1a1b20;
        --text: #efeae1;
        --muted: #a29d94;
        --accent: #e85a45;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.6;
    }
    main { width: min(680px, 100%); padding: 48px 24px; }
    h1 { margin: 0 0 18px; font-size: clamp(2rem, 6vw, 3rem); line-height: 1.1; }
    p { margin: 0; color: var(--muted); font-size: 1.1rem; }
    a { color: var(--accent); }
  </style>
</head>
<body>
  <main>
    <h1>NeverMiss Privacy Policy</h1>
    <p>NeverMiss does not collect, store, or share personal data. Calendar information and settings are processed only on your device and are never sent to Technical Assemblage; questions can be sent to <a href="mailto:info@technicalassemblage.com">info@technicalassemblage.com</a>.</p>
  </main>
</body>
</html>
